name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 语法检查
        run: |
          node --check server.js
          for f in lib/*.js tools/*.js web/app.js test/*.js; do node --check "$f"; done
      - name: 单元测试 + 接口集成测试（内置 mock engine，不需要 Docker）
        run: npm test
